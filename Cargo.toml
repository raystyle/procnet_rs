[package]
name = "procnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Mini per-process network correlation library (rustnet-host absorption) + CLI: process-attributed socket snapshots as NDJSON"
repository = "https://github.com/raystyle/procnet_rs"

[lib]
name = "procnet"
path = "src/lib.rs"

[[bin]]
name = "procnet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[profile.release]
lto = true
strip = true
