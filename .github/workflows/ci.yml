name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
    runs-on: ${{ contains(matrix.target, 'apple') && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: runner.os == 'Linux'
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo run --release --target x86_64-unknown-linux-musl -- snapshot | head -2
      - name: Smoke (macos lsof)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo run --release --target aarch64-apple-darwin -- snapshot | head -2
